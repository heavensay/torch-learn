[project]
name = "pyproject.toml"
version = "0.1.0"
description = "向量数据库milvus功能demo"
readme = "README.md"
#requires-python = ">=3.14"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy<2",
    "pymilvus",
    "milvus-lite", #milvus-lite本地数据库，用于小数据集测试使用
    "torch==2.2.2",
    "torchvision==0.17.2",
    "matplotlib",
    "timm",
    "scikit-learn",
    "streamlit",
    "streamlit-cropper",
]


[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
